name: Build SimHelp iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify English app text
        run: python3 scripts/audit_ios_english.py
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS/AirSIM.xcodeproj \
            -scheme AirSIM \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5 \
            SWIFT_STRICT_CONCURRENCY=none \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/derived/Build/Products/Release-iphoneos/AirSIM.app"
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/SimHelp.app
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName SimHelp' build/ipa/Payload/SimHelp.app/Info.plist || true
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName SimHelp' build/ipa/Payload/SimHelp.app/Info.plist || true
          # The Watch companion keeps the original placeholder bundle id and
          # causes Sideloadly to reject the whole archive after it rewrites the
          # iPhone bundle id. The phone app works independently, so omit the
          # optional Watch target from this personal sideload build.
          rm -rf build/ipa/Payload/SimHelp.app/Watch
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/SimHelp-iPhone-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SimHelp-iPhone-unsigned
          path: build/SimHelp-iPhone-unsigned.ipa
          if-no-files-found: error


