name: Build Telegram without notch logo

on:
  push:
    branches: [codex/telegram-no-notch-logo]
    paths:
      - .github/workflows/telegram-no-logo.yml
      - scripts/telegram_no_logo.py
      - scripts/check_telegram_cloud_bootstrap.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-no-notch-logo
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      UPSTREAM_COMMIT: 24638bc69bd083981b178dd1e7f921eebbf7fc46
      PERSONAL_TELEGRAM_API_ID: ${{ secrets.PERSONAL_TELEGRAM_API_ID }}
      PERSONAL_TELEGRAM_API_HASH: ${{ secrets.PERSONAL_TELEGRAM_API_HASH }}
    steps:
      - name: Check out build tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned Telegram source
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: telegram-source
          submodules: recursive
          persist-credentials: false

      - name: Select required Xcode
        working-directory: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${version}.app/Contents/Developer"
          xcodebuild -version
          df -h .

      - name: Remove notch logo from source
        run: python3 scripts/telegram_no_logo.py patch telegram-source

      - name: Reproduce previous recursion and verify bootstrap fix
        run: python3 scripts/check_telegram_cloud_bootstrap.py telegram-source

      - name: Configure personal build without unavailable iCloud capability
        working-directory: telegram-source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          source = Path('build-system/appstore-configuration.json')
          config = json.loads(source.read_text())
          api_id = os.environ.get('PERSONAL_TELEGRAM_API_ID', '')
          api_hash = os.environ.get('PERSONAL_TELEGRAM_API_HASH', '')
          if not api_id.isdecimal() or int(api_id) <= 0 or int(api_id) == 8 or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              raise SystemExit('A personal Telegram API ID and hash must be configured as build secrets')
          config['api_id'] = api_id
          config['api_hash'] = api_hash
          config['is_appstore_build'] = 'false'
          config['enable_icloud'] = False
          Path('build-system/personal-configuration.json').write_text(json.dumps(config))
          PY

      - name: Import upstream verification certificates
        working-directory: telegram-source
        run: python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

      - name: Renew expired self-signed build fixtures
        run: python3 scripts/telegram_no_logo.py refresh-verification-profiles telegram-source

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel
          key: telegram-no-logo-xcode27-${{ env.UPSTREAM_COMMIT }}-${{ github.run_id }}
          restore-keys: telegram-no-logo-xcode27-${{ env.UPSTREAM_COMMIT }}-

      - name: Compile arm64 iPhone application
        working-directory: telegram-source
        shell: bash
        run: |
          set -euo pipefail
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$RUNNER_TEMP/telegram-bazel" \
            build \
            --configurationPath=build-system/personal-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=100005 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/telegram-artifacts"

      - name: Package and verify sideload IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/telegram_no_logo.py package \
            "$RUNNER_TEMP/telegram-artifacts/Telegram.ipa" \
            dist/Telegram-100005-unsigned.ipa \
            --commit "$UPSTREAM_COMMIT"
          cp dist/Telegram-100005-unsigned.json dist/build-provenance.json
          git -C telegram-source diff -- submodules/Display/Source/WindowContent.swift submodules/CloudData/Sources/CloudData.swift submodules/TelegramUI/Sources/AppDelegate.swift > dist/remove-notch-logo.patch

      - name: Upload IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-100005-unsigned
          path: |
            dist/Telegram-100005-unsigned.ipa
            dist/build-provenance.json
            dist/remove-notch-logo.patch
          if-no-files-found: error
          retention-days: 14

      - name: Save compiler cache
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/telegram-bazel
          key: telegram-no-logo-xcode27-${{ env.UPSTREAM_COMMIT }}-${{ github.run_id }}
